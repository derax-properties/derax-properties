<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="darkBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151b"/>
      <stop offset="55%" stop-color="#0c0f14"/>
      <stop offset="100%" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="streak1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#aeb8c4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c7d0da" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#darkBase)"/>

  <!-- Glossy diagonal streaks, top-left corner -->
  <polygon points="0,0 260,0 40,240 -40,240" fill="url(#streak1)"/>
  <polygon points="120,0 190,0 -60,300 -160,300" fill="url(#streak2)"/>

  <!-- Wide glossy streak sweeping across, bottom-right -->
  <polygon points="1180,1080 1520,1080 2020,560 1780,560" fill="url(#streak1)"/>
  <polygon points="1980,1080 2060,1080 2060,900 1660,1080" fill="url(#streak2)" opacity="0.7"/>

  <!-- Faint gold thread tying the two modes together -->
  <path d="M-40,300 C420,120 900,260 1920,80" fill="none" stroke="url(#goldThread)" stroke-width="2.5"/>

  <!-- Subtle vertical highlight edge, left border, echoing the sidebar rim -->
  <rect x="0" y="0" width="2" height="1080" fill="#c9a24b" opacity="0.18"/>
</svg>
