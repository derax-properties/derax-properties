<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="warmBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfaf3"/>
      <stop offset="55%" stop-color="#f8f1e4"/>
      <stop offset="100%" stop-color="#f3ead8"/>
    </linearGradient>
    <linearGradient id="bandWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe3ca"/>
      <stop offset="100%" stop-color="#e9dcbd"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0"/>
      <stop offset="14%" stop-color="#d9b46a" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#d9b46a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#warmBase)"/>

  <!-- Top-left band: wide at the corner, tapering into a thin diagonal sweep -->
  <path d="M -20,-20 C 400,-20 700,10 750,80 C 550,180 300,260 -20,220 Z" fill="url(#bandWarm)" opacity="0.55"/>
  <path d="M -20,-20 C 400,-20 700,10 750,80 C 1000,40 1300,110 1920,10" fill="none" stroke="url(#goldLine)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Bottom-left band, mirrored -->
  <path d="M -20,1100 C 400,1100 700,1070 750,1000 C 550,900 300,820 -20,860 Z" fill="url(#bandWarm)" opacity="0.5"/>
  <path d="M -20,1100 C 400,1100 700,1070 750,1000 C 1000,1040 1300,970 1920,1070" fill="none" stroke="url(#goldLine)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Faint architectural line-sketch, right side -->
  <g stroke="#1c3a2c" stroke-width="1.4" fill="none" opacity="0.1" transform="translate(1330,340)">
    <polyline points="0,360 0,180 190,20 380,180 380,360"/>
    <polyline points="0,180 190,40 380,180"/>
    <polyline points="60,360 60,220 150,220 150,360"/>
    <rect x="190" y="230" width="70" height="70"/>
    <line x1="225" y1="230" x2="225" y2="300"/>
    <line x1="190" y1="265" x2="260" y2="265"/>
    <rect x="290" y="250" width="60" height="110"/>
    <line x1="320" y1="250" x2="320" y2="360"/>
    <line x1="290" y1="305" x2="350" y2="305"/>
    <line x1="-40" y1="360" x2="420" y2="360"/>
  </g>
</svg>
